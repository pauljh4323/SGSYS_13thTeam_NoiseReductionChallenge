# dsp-p Stage P2a: NLM estimate of the ML a priori SNR term mixed into DD xi (nlm_mix 0.5) on the P1 result = dsp-v7
# (P1 / P1b kept the reference). Full train (1296), paired keep rule vs dsp_k (per-file from outputs/dsp_k/eval_train.csv).
# Patch 3x3 / 5x3 = nlm_patch_t {3, 5} x nlm_patch_f 3.
method: mmse_lsa
base_params:
  n_fft: 1024
  hop: 256
  window: hann
  noise_est: spp_mean
  noise_fraction: 0.10
  spp_iters: 3
  spp_xi_h1_db: 10
  noise_bias: 1.25
  alpha: 0.94
  xi_min_db: -25
  gmin_db: -30
  xi_mode: hrnr
  hrnr_rho: 0.3
  xi_cepstral_smoothing: false
  highpass_hz: 100
  noise_bias_low: 1.25
  noise_bias_high: 1.5
  xi_nlm: true
  nlm_patch_f: 3
  nlm_mix: 0.5
grid:
  nlm_patch_t: [3, 5]
  nlm_search_t: [4, 8]
  nlm_search_f: [2, 4]
  nlm_h: [0.5, 1.0, 2.0]
stage_reference: configs/dsp_k.yaml
