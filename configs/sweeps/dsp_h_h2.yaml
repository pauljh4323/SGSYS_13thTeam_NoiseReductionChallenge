# dsp-h Stage H2 at the H1 result (kept dsp-v5 LSA; beta 0.5 d=-0.0124, -0.5 d=-0.0133): pause expander (own design).
# Train-400 subset (seed 0); paired keep rule vs the stage reference (d >= 0.002 and d >= 2*SE).
method: mmse_lsa
base_params:
  n_fft: 1024
  hop: 256
  window: hann
  noise_est: initial
  noise_fraction: 0.10
  noise_bias: 1.25
  alpha: 0.94
  xi_min_db: -25
  gmin_db: -30
  xi_mode: hrnr
  hrnr_rho: 0.3
  xi_cepstral_smoothing: false
  highpass_hz: 100
grid:
  pause_thr_db: [3, 6]
  pause_att_db: [4, 8]
  pause_release_frames: [4, 8]
stage_reference: configs/dsp_g.yaml
