# dsp-tune Stage C at the Stage B best (dsp_tune_b_004: xi_mode hrnr, cepstral off, on the Stage A best
# n_fft 1024 / hop 256 / noise_bias 1.25 / noise_fraction 0.10): output high-pass. 3 points.
# Run on the 400-file stratified train subset (seed 0): --split train --subset 400.
method: mmse_lsa
base_params:
  n_fft: 1024
  hop: 256
  window: hann
  noise_est: initial
  noise_fraction: 0.10
  noise_bias: 1.25
  alpha: 0.96
  xi_min_db: -15
  gmin_db: -25
  xi_mode: hrnr
  xi_cepstral_smoothing: false
grid:
  highpass_hz: [0, 60, 100]
reference:
  - configs/mmse_lsa_top1.yaml
