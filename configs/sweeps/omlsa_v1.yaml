# OM-LSA / IMCRA sweep v1. Tune on a fixed 160-file stratified TRAIN subset (seed 0):
#   python scripts/sweep.py --grid configs/sweeps/omlsa_v1.yaml --split train --subset 160 --jobs 8
# 8 lsa points + 16 omlsa points + reference mmse_lsa_top1 = 25 configs. Rows -> logs/ only.
method: omlsa
base_params:
  n_fft: 512
  hop: 128
  window: hann
  noise_fraction: 0.20
  xi_min_db: -15
grid_groups:
  - noise_est: [initial, imcra]
    gain_mode: [lsa]
    alpha: [0.92, 0.96]
    gmin_db: [-25, -20]
  - noise_est: [initial, imcra]
    gain_mode: [omlsa]
    alpha: [0.92, 0.96]
    gmin_db: [-25, -20]
    q_max: [0.5, 0.8]
reference:
  - configs/mmse_lsa_top1.yaml
