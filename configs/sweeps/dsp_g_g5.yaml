# dsp-g Stage G5 at the G4 result (kept dsp-v4; per-band selection hurt, B=2 d=-0.0240): HRNR rectifier x rho.
# Train-400 subset (seed 0); paired keep rule vs the stage reference (d >= 0.002 and d >= 2*SE). halfwave = max(s,0), fullwave = |s|.
method: mmse_lsa
base_params:
  n_fft: 1024
  hop: 256
  window: hann
  noise_est: initial
  noise_fraction: 0.10
  noise_bias: 1.25
  alpha: 0.94
  xi_min_db: -25
  gmin_db: -30
  xi_mode: hrnr
  hrnr_rho: 0.5
  xi_cepstral_smoothing: false
  highpass_hz: 100
grid:
  hrnr_nonlinearity: [halfwave, fullwave]
  hrnr_rho: [0.3, 0.5]
stage_reference: configs/dsp_edge.yaml
