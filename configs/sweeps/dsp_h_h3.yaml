# dsp-h Stage H3 at the H2 result (kept dsp-v5; best pause 6/4/4 d=+0.0040 +- 0.0020, z 1.98 < 2): two-band noise
# over-estimation (after Kamath & Loizou 2002), split 1 kHz, 200 Hz raised-cosine cross-fade. 1.25/1.25 == dsp_g.
# Train-400 subset (seed 0); paired keep rule vs the stage reference (d >= 0.002 and d >= 2*SE).
method: mmse_lsa
base_params:
  n_fft: 1024
  hop: 256
  window: hann
  noise_est: initial
  noise_fraction: 0.10
  noise_bias: 1.25
  alpha: 0.94
  xi_min_db: -25
  gmin_db: -30
  xi_mode: hrnr
  hrnr_rho: 0.3
  xi_cepstral_smoothing: false
  highpass_hz: 100
grid:
  noise_bias_low: [1.0, 1.25, 1.5]
  noise_bias_high: [1.0, 1.25, 1.5]
stage_reference: configs/dsp_g.yaml
