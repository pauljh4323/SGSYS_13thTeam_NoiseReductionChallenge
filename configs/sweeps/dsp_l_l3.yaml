# dsp-l Stage L3 at L2 adopted (= dsp_k, spp 3 / 10 dB / prior 0.5): two-band noise bias re-tune (high extended to 1.75).
# Train-400 subset (seed 0); paired keep rule vs the stage reference (d >= 0.002 and >= 2*SE).
method: mmse_lsa
base_params:
  n_fft: 1024
  hop: 256
  window: hann
  noise_est: spp_mean
  noise_fraction: 0.10
  noise_bias: 1.25
  alpha: 0.94
  xi_min_db: -25
  gmin_db: -30
  xi_mode: hrnr
  hrnr_rho: 0.3
  xi_cepstral_smoothing: false
  highpass_hz: 100
  spp_iters: 3
  spp_xi_h1_db: 10
  spp_prior: 0.5
grid:
  noise_bias_low: [1.0, 1.25, 1.5]
  noise_bias_high: [1.25, 1.5, 1.75]
reference:
  - configs/dsp_k.yaml
stage_reference: configs/dsp_k.yaml
