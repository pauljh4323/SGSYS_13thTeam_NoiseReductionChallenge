# dsp-edge Stage E1 on dsp-v3 (dsp_retune): extend alpha x xi_min_db past the D1 grid edge
# (D1 best alpha 0.94 / xi_min_db -20 sat on the low edge of both axes). 3 x 3 = 9 points.
# Run on the 400-file stratified train subset (seed 0): --split train --subset 400.
method: mmse_lsa
base_params:
  n_fft: 1024
  hop: 256
  window: hann
  noise_est: initial
  noise_fraction: 0.10
  noise_bias: 1.25
  gmin_db: -25
  xi_mode: hrnr
  hrnr_rho: 0.5
  xi_cepstral_smoothing: false
  highpass_hz: 100
grid:
  alpha: [0.90, 0.92, 0.94]
  xi_min_db: [-30, -25, -20]
reference:
  - configs/dsp_retune.yaml
