# dsp-k Stage K3 at the K2 result (kept K1: every tv_noise point lost, best W=32 tv_bias 1.0 d=-0.2148): two-band bias
# re-tuned for the spp_mean estimate (LSD signed bias +1.4 dB vs +4.6 dB for the dsp-v6 estimate). 1.25/1.5 == K1.
# Train-400 subset (seed 0); paired keep rule vs the stage reference (d >= 0.002 and >= 2*SE).
method: mmse_lsa
base_params:
  n_fft: 1024
  hop: 256
  window: hann
  noise_est: spp_mean
  noise_fraction: 0.10
  spp_iters: 3
  spp_xi_h1_db: 10
  noise_bias: 1.25
  alpha: 0.94
  xi_min_db: -25
  gmin_db: -30
  xi_mode: hrnr
  hrnr_rho: 0.3
  xi_cepstral_smoothing: false
  highpass_hz: 100
grid:
  noise_bias_low: [1.0, 1.25, 1.5]
  noise_bias_high: [1.0, 1.25, 1.5]
reference:
  - configs/dsp_h.yaml
stage_reference: configs/dsp_k_k1.yaml
