# dsp-m Stage M2 at the M1 result (M1 kept dsp_k: all 6 P1 points lost, best K=1 thr 0.3 d=-0.0079 +- 0.0006):
# P2 harmonic phase reconstruction (YIN f0 from the dsp-v7 output, re-anchoring on). Train-400 (seed 0); paired keep rule vs dsp_k.
method: mmse_lsa
base_params:
  n_fft: 1024
  hop: 256
  window: hann
  noise_est: spp_mean
  noise_fraction: 0.10
  spp_iters: 3
  spp_xi_h1_db: 10
  noise_bias: 1.25
  alpha: 0.94
  xi_min_db: -25
  gmin_db: -30
  xi_mode: hrnr
  hrnr_rho: 0.3
  xi_cepstral_smoothing: false
  highpass_hz: 100
  noise_bias_low: 1.25
  noise_bias_high: 1.5
  phase_harmonic: true
  phase_reanchor: true
grid:
  phase_gain_thr: [0.3, 0.6]
  phase_beta: [0.5, 1.0]
  phase_bins: [1, 2]
stage_reference: configs/dsp_k.yaml
