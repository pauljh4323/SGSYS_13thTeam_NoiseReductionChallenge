# dsp-p Stage P1: DD recursion direction on dsp-v7 (dsp_k). Full train (1296); paired keep rule vs the stage
# reference (d >= 0.002 and >= 2*SE). forward = the stage reference (per-file from outputs/dsp_k/eval_train.csv, c330f12;
# defaults bit-identical, 20 train files max |diff| 0.0), so only the other directions run.
method: mmse_lsa
base_params:
  n_fft: 1024
  hop: 256
  window: hann
  noise_est: spp_mean
  noise_fraction: 0.10
  spp_iters: 3
  spp_xi_h1_db: 10
  noise_bias: 1.25
  alpha: 0.94
  xi_min_db: -25
  gmin_db: -30
  xi_mode: hrnr
  hrnr_rho: 0.3
  xi_cepstral_smoothing: false
  highpass_hz: 100
  noise_bias_low: 1.25
  noise_bias_high: 1.5
grid:
  dd_direction: [backward, avg, geo]
stage_reference: configs/dsp_k.yaml
