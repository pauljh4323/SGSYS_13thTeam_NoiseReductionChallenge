# dsp-retune finalist: D3 best (dsp_retune_d3_001; 400-file train subset PESQ 1.9002 vs dsp-v2 dsp_tune_c 1.8568,
# logs/sweep_dsp_retune_d{1,2,3}.csv). dsp-v2 with alpha 0.96 -> 0.94 and xi_min_db -15 -> -20 (D1);
# D2 (noise_bias, hrnr_rho) and D3 (n_fft, noise_fraction) kept the dsp-v2 values.
method: mmse_lsa
params:
  n_fft: 1024
  hop: 256
  window: hann
  noise_est: initial
  noise_fraction: 0.10
  noise_bias: 1.25
  alpha: 0.94
  xi_min_db: -20
  gmin_db: -25
  xi_mode: hrnr
  hrnr_rho: 0.5
  xi_cepstral_smoothing: false
  highpass_hz: 100
