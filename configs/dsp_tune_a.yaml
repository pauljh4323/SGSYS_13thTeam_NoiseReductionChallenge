# dsp-tune finalist A: Stage A best (dsp_tune_a_012; 400-file train subset PESQ 1.8101 vs dsp-v1 1.7659,
# logs/sweep_dsp_tune_a.csv). Plain DD/LSA with n_fft 1024 and 1.25x noise over-estimation.
method: mmse_lsa
params:
  n_fft: 1024
  hop: 256
  window: hann
  noise_est: initial
  noise_fraction: 0.10
  noise_bias: 1.25
  alpha: 0.96
  xi_min_db: -15
  gmin_db: -25
