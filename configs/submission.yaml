# Submission config (Challenge 2, deep learning; branch r2-prep) = configs/dl/gru_v8p2z2.yaml (method/params verbatim):
# gru_v8p2z2 = gru_v8p2y continued with train-time rms_norm (target_rms 0.079130, gain augmentation off) and full
# dynamic mixing (Zeghidour & Grangier 2021: every sample a random train clean + the noise of a random other train file,
# p 0.2 second noise at U[-10, 0] dB, SNR U[-5, 20] dB); same loss 0.2 cmag + 0.32 torch-pesq, init weights/gru_v8p2y.pt,
# fresh Adam 5e-5, best epoch 117 of 147 (early stop); branch exp/r2-dmix, scripts/train_dpesq.py; train split only.
# Level mode rms_norm: the input is scaled to target_rms = 0.079130 (median whole-file RMS of the train noisy files,
# scripts/rms_target.py) before the model; the output stays at that level (no inverse gain; peak capped at 0.99).
# val PESQ 3.5452 / SNR 1.35 dB, val_remix 3.4065 (vs gru_v8p2y + rms_norm +0.0432, z 11.1); level probe
# -30/-20/-10/0 dB 3.545 each (docs/exp_r2_dmix.md on exp/r2-dmix).
# Fallbacks (copy their method/params here to revert): gru_v8p2y + rms_norm (configs/dl/gru_v8p2y_rmsn.yaml; val 3.5077 /
# 1.88 dB), gru_v8p2x + rms_norm (configs/dl/gru_v8p2x_rmsn.yaml; val 3.4867 / 2.24 dB) and gru_v5b
# (configs/dl/gru_v5b_off.yaml; val 2.6962 / 16.81 dB). Round-1 submission (dsp-v7) stays on main.
method: gru_mask
params:
  weights: weights/gru_v8p2z2.pt  # resolved against the repo root, not the cwd
  device: cpu
  level_norm: true
  level_mode: rms_norm
  target_rms: 0.079130
