# Submission config (Challenge 1, traditional DSP) = configs/dsp_h.yaml verbatim:
# dsp-h finalist (H3, branch exp/dsp-h): dsp-v5 (MMSE-LSA, n_fft 1024, noise_fraction 0.10, HRNR a priori SNR with
# hrnr_rho 0.3, alpha 0.94, xi_min_db -25, gmin_db -30, 100 Hz zero-phase high-pass) with two-band noise over-estimation
# noise_bias_low 1.25 / noise_bias_high 1.5 (split 1 kHz, 200 Hz cross-fade). Full-train paired d +0.0049 +- 0.0011
# (z 4.45), val PESQ 1.9637 (dsp-v5 1.9570), val_remix 1.8524 (1.8500); revised promotion rule. Tag dsp-v6.
method: mmse_lsa
params:
  n_fft: 1024
  hop: 256
  window: hann
  noise_est: initial
  noise_fraction: 0.10
  noise_bias: 1.25
  alpha: 0.94
  xi_min_db: -25
  gmin_db: -30
  xi_mode: hrnr
  hrnr_rho: 0.3
  xi_cepstral_smoothing: false
  highpass_hz: 100
  noise_bias_low: 1.25
  noise_bias_high: 1.5
