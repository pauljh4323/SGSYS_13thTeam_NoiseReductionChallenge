# Submission config (Challenge 1, traditional DSP) = configs/dsp_retune.yaml verbatim:
# dsp-retune finalist (D3 best dsp_retune_d3_001, branch exp/dsp-retune): dsp-v2 (MMSE-LSA, n_fft 1024,
# noise_bias 1.25, noise_fraction 0.10, HRNR a priori SNR, 100 Hz zero-phase high-pass) with
# decision-directed alpha 0.94 and xi_min_db -20. Val PESQ 1.9352 (dsp-v2 1.8746). Tag dsp-v3.
method: mmse_lsa
params:
  n_fft: 1024
  hop: 256
  window: hann
  noise_est: initial
  noise_fraction: 0.10
  noise_bias: 1.25
  alpha: 0.94
  xi_min_db: -20
  gmin_db: -25
  xi_mode: hrnr
  hrnr_rho: 0.5
  xi_cepstral_smoothing: false
  highpass_hz: 100
