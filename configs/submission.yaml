# Submission config (Challenge 2, deep learning; branch r2-prep) = configs/dl/gru_v8p2x_rmsn.yaml (method/params verbatim):
# gru_v8p2x = gru_v8p2 continued for 200 epochs with the same differentiable-PESQ loss (0.2 cmag + 0.32 torch-pesq;
# init weights/gru_v8p2.pt, fresh Adam 5e-5, best epoch 194; branch exp/r2-dpesq, scripts/train_dpesq.py; train split only).
# Level mode rms_norm: the input is scaled to target_rms = 0.079130 (median whole-file RMS of the train noisy files,
# scripts/rms_target.py) before the model; the output stays at that level (no inverse gain; peak capped at 0.99).
# val PESQ 3.4867 / SNR 2.24 dB, val_remix 3.3453; level probe -30/-20/-10/0 dB 3.487 each.
# Fallbacks (copy their method/params here to revert): gru_v8p2 (configs/dl/gru_v8p2.yaml, level norm off; val 3.3983 /
# 4.48 dB) and gru_v5b (configs/dl/gru_v5b_off.yaml; val 2.6962 / 16.81 dB). Round-1 submission (dsp-v7) stays on main.
method: gru_mask
params:
  weights: weights/gru_v8p2x.pt  # resolved against the repo root, not the cwd
  device: cpu
  level_norm: true
  level_mode: rms_norm
  target_rms: 0.079130
