# Submission config (Challenge 1, traditional DSP) = configs/dsp_tune_c.yaml verbatim:
# dsp-tune finalist C (Stage C best dsp_tune_c_002, branch exp/dsp-tune): MMSE-LSA, n_fft 1024,
# noise_bias 1.25, noise_fraction 0.10, HRNR a priori SNR, 100 Hz zero-phase high-pass.
# Val PESQ 1.8746 (dsp-v1 1.7505). Tag dsp-v2.
method: mmse_lsa
params:
  n_fft: 1024
  hop: 256
  window: hann
  noise_est: initial
  noise_fraction: 0.10
  noise_bias: 1.25
  alpha: 0.96
  xi_min_db: -15
  gmin_db: -25
  xi_mode: hrnr
  xi_cepstral_smoothing: false
  highpass_hz: 100
