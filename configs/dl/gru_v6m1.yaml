# gru_v6m1 (exp/r2-mgan): MetricGAN+-style fine-tune of gru_v5b (Fu et al. 2021) with a learned PESQ discriminator.
# G loss = 1.0 cmag + 0.5 MR-STFT + 0.3 (-SI-SDR) + 0.05 (D(enh, clean) - 1)^2. Train: scripts/train_mgan.py (not train.py).
# Inference: method/params (level norm off, like gru_v5b_off); model/train: training only.
method: gru_mask
params:
  weights: weights/gru_v6m1.pt  # copy <ckpt-dir>/best.pt here after training
  device: cpu
  level_norm: false

model:            # = gru_v5b
  n_fft: 512
  hop: 128
  hidden: 256
  layers: 2
  front_end: conv2d
  conv_channels: 16
  conv_norm: group

train:
  seed: 0
  init_from: weights/gru_v5b.pt   # warm start G (magnitude mask); D from the shared pretrain (--d-init)
  epochs: 60
  batch_size: 16
  lr: 1.0e-4                      # G, constant
  grad_clip: 5.0
  compress: 0.3
  loss: cmag+mrstft+sisdr
  lambda_cmag: 1.0
  lambda_mrstft: 0.5
  lambda_sisdr: 0.3
  val_every: 1
  val_batch: 16
  patience_val_points: 15         # early stop: 15 epochs without a val PESQ gain
  mgan:
    lambda_metric: 0.05
    lr_d: 2.0e-4                  # D, constant
    replay_frac: 0.2              # replayed past enhanced rows = 20 % of each D batch
    replay_capacity: 512          # reservoir sample, float16 (~98 MB in last.pt)
    d_pretrain_epochs: 2          # D alone on frozen gru_v5b outputs (shared by gru_v6m1..3)
  remix:                          # = gru_v5b
    p_original: 0.5
    snr_db: [-5, 20]
    gain_mode: mixture
    p_wide: 0.5
    gain_wide_db: [-30, 6]
    gain_narrow_db: [-6, 3]
    peak: 0.99
