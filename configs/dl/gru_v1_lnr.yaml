# gru_v1 weights + inference-only train-range level clamp (no retraining). Measure: active;
# levels inside the train-split active p5..p95 [-27.88, -15.27] dBFS are left untouched (g = 0);
# outside, the input is moved to the nearest edge and the output scaled back
# (scripts/level_stats.py, logs/level_stats.csv; no validation statistics used).
method: gru_mask
params:
  weights: weights/gru_v1.pt   # resolved against the repo root, not the cwd
  device: cpu
  level_norm: true
  level_measure: active
  level_mode: range
  lo_dbfs: -27.88
  hi_dbfs: -15.27
  max_boost_db: 30.0
  max_cut_db: 12.0
