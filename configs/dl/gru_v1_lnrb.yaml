# gru_v1 weights + inference-only asymmetric train-range level (no retraining). Measure: active;
# levels inside the train-split active p5..p95 [-27.88, -15.27] dBFS are left untouched (g = 0);
# above p95 the input is cut to -15.27; below p5 it is boosted to the train median -19.60; the
# output is scaled back by the inverse gain (scripts/level_stats.py, logs/level_stats.csv;
# no validation statistics used).
method: gru_mask
params:
  weights: weights/gru_v1.pt   # resolved against the repo root, not the cwd
  device: cpu
  level_norm: true
  level_measure: active
  level_mode: range_boost
  lo_dbfs: -27.88
  hi_dbfs: -15.27
  target_dbfs: -19.60
  max_boost_db: 30.0
  max_cut_db: 12.0
